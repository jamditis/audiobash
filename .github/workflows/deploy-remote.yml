name: Deploy Remote to Cloudflare Pages

on:
  push:
    branches:
      - master
    paths:
      - 'docs/remote/**'
      - '.github/workflows/deploy-remote.yml'
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    # The environment allows only master; keep deploy secrets scoped to it.
    environment: cloudflare-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy Remote to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/remote --project-name=audiobash --commit-dirty=true
