name: Build Microsoft Store test package

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed 40-character commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-windows-store-test:
    name: Windows Store test package x64
    runs-on: windows-latest
    env:
      AUDIOBASH_STORE_MODE: test
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false

      - name: Verify exact release commit
        shell: bash
        env:
          DISPATCH_COMMIT: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          REQUESTED_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_REF" = "refs/heads/master"
          test "$DISPATCH_COMMIT" = "$REQUESTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$REQUESTED_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Verify toolchain
        run: npm run verify:toolchain

      - name: Install locked dependencies
        run: |
          npm ci
          npm ls electron-builder@26.15.3 app-builder-lib

      - name: Run source gates
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run version:check
          npm run test:store:win

      - name: Build unsigned test-identity AppX
        run: npm run electron:build:store:win

      - name: Resolve, unpack, and verify the exact AppX
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedName = 'AudioBash-3.4.0-store-test-x64.appx'
          $storeDirectory = Join-Path $PWD 'release/microsoft-store-test'
          $artifacts = @(Get-ChildItem -LiteralPath $storeDirectory -Filter '*.appx' -File)
          if ($artifacts.Count -ne 1) {
            throw "Expected one AppX artifact, found $($artifacts.Count)"
          }
          if ($artifacts[0].Name -cne $expectedName) {
            throw "Unexpected AppX artifact: $($artifacts[0].Name)"
          }

          $makeAppx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter makeappx.exe -File |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $makeAppx) {
            throw 'Windows SDK makeappx.exe is unavailable'
          }

          $unpacked = Join-Path $env:RUNNER_TEMP 'audiobash-store-unpacked'
          & $makeAppx.FullName unpack /p $artifacts[0].FullName /d $unpacked /o
          if ($LASTEXITCODE -ne 0) {
            throw "MakeAppx unpack failed with exit code $LASTEXITCODE"
          }

          node scripts/verify-windows-store-package.cjs $unpacked $artifacts[0].FullName |
            Set-Content -Encoding ascii (Join-Path $storeDirectory 'SHA256-windows-store-test-x64.txt')
          if ($LASTEXITCODE -ne 0) {
            throw "Store package verification failed with exit code $LASTEXITCODE"
          }
          Copy-Item -LiteralPath (Join-Path $unpacked 'AppxManifest.xml') `
            -Destination (Join-Path $storeDirectory 'AppxManifest.test.xml')
          "name=$expectedName" >> $env:GITHUB_OUTPUT

      - name: Sideload and probe a temporary signed copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $storeDirectory = Join-Path $PWD 'release/microsoft-store-test'
          $unsignedPackage = Join-Path $storeDirectory '${{ steps.package.outputs.name }}'
          $signedPackage = Join-Path $env:RUNNER_TEMP 'AudioBash-store-sideload.appx'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'AudioBash-store-sideload.pfx'
          $cerPath = Join-Path $env:RUNNER_TEMP 'AudioBash-store-sideload.cer'
          $certificate = $null
          $trustedCertificate = $null
          $installedPackage = $null
          $cleanupFailures = [Collections.Generic.List[string]]::new()

          function Invoke-CleanupAction {
            param([scriptblock] $Action)
            try {
              & $Action
            }
            catch {
              $script:cleanupFailures.Add($_.Exception.Message)
            }
          }

          try {
            Copy-Item -LiteralPath $unsignedPackage -Destination $signedPackage
            $certificate = New-SelfSignedCertificate `
              -Type Custom `
              -Subject 'CN=AudioBash Store Test' `
              -FriendlyName 'AudioBash Store temporary sideload test' `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -KeyExportPolicy Exportable `
              -KeyUsage DigitalSignature `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')

            $plainPassword = [Guid]::NewGuid().ToString('N')
            $securePassword = ConvertTo-SecureString -String $plainPassword -AsPlainText -Force
            Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $securePassword |
              Out-Null
            Export-Certificate -Cert $certificate -FilePath $cerPath | Out-Null

            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse -Filter signtool.exe -File |
              Sort-Object FullName |
              Select-Object -Last 1
            if (-not $signTool) {
              throw 'Windows SDK signtool.exe is unavailable'
            }
            & $signTool.FullName sign /fd SHA256 /f $pfxPath /p $plainPassword $signedPackage
            if ($LASTEXITCODE -ne 0) {
              throw "SignTool failed with exit code $LASTEXITCODE"
            }

            $trustedCertificate = Import-Certificate `
              -FilePath $cerPath `
              -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople'
            Add-AppxPackage -Path $signedPackage
            $installedPackage = Get-AppxPackage -Name 'AudioBash.Store.Test' |
              Sort-Object Version -Descending |
              Select-Object -First 1
            if (-not $installedPackage) {
              throw 'The AudioBash test package was not registered'
            }

            $env:AUDIOBASH_WINDOWS_PACKAGE_ROOT = Join-Path $installedPackage.InstallLocation 'app'
            npm run test:package:win
            if ($LASTEXITCODE -ne 0) {
              throw "Installed package probe failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Invoke-CleanupAction {
              Remove-Item Env:\AUDIOBASH_WINDOWS_PACKAGE_ROOT -ErrorAction SilentlyContinue
            }

            $packagesToRemove = @()
            try {
              $packagesToRemove = @(Get-AppxPackage -Name 'AudioBash.Store.Test')
            }
            catch {
              $cleanupFailures.Add($_.Exception.Message)
            }
            foreach ($packageToRemove in $packagesToRemove) {
              Invoke-CleanupAction {
                Remove-AppxPackage -Package $packageToRemove.PackageFullName -ErrorAction Stop
              }
            }

            foreach ($trustedCertificateToRemove in @($trustedCertificate)) {
              if ($trustedCertificateToRemove) {
                Invoke-CleanupAction {
                  Remove-Item `
                    -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($trustedCertificateToRemove.Thumbprint)" `
                    -Force `
                    -ErrorAction Stop
                }
              }
            }
            if ($certificate) {
              Invoke-CleanupAction {
                Remove-Item `
                  -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" `
                  -Force `
                  -ErrorAction Stop
              }
            }
            foreach ($temporaryPath in @($signedPackage, $pfxPath, $cerPath)) {
              if (Test-Path -LiteralPath $temporaryPath) {
                Invoke-CleanupAction {
                  Remove-Item -LiteralPath $temporaryPath -Force -ErrorAction Stop
                }
              }
            }
            if ($cleanupFailures.Count -gt 0) {
              throw "Store test cleanup failed: $($cleanupFailures -join '; ')"
            }
          }

      - name: Upload verified test package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-store-test-x64
          path: |
            release/microsoft-store-test/${{ steps.package.outputs.name }}
            release/microsoft-store-test/SHA256-windows-store-test-x64.txt
            release/microsoft-store-test/AppxManifest.test.xml
          if-no-files-found: error
          retention-days: 14
