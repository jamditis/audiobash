name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Verify toolchain
        run: npm run verify:toolchain

      - name: Install dependencies
        run: npm ci

      - name: Prettier (check)
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript (typecheck)
        run: npm run typecheck

      - name: Tests
        run: npm test

  process-lifecycle:
    name: Process lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tests: tests/unit/processTree.test.ts tests/unit/windowsJobOwnerSource.test.ts tests/unit/transcriptionJob.test.ts tests/unit/appShutdown.test.ts tests/unit/whisperService.test.ts tests/unit/localWhisperHandlers.test.ts tests/unit/transcriptionService.test.ts tests/startup-crash.test.ts tests/integration/processTree.macos.test.ts
          - os: windows-latest
            tests: tests/unit/processTree.test.ts tests/unit/windowsJobOwnerSource.test.ts tests/unit/transcriptionJob.test.ts tests/unit/appShutdown.test.ts tests/unit/whisperService.test.ts tests/unit/localWhisperHandlers.test.ts tests/unit/transcriptionService.test.ts tests/startup-crash.test.ts tests/integration/processTree.windows.test.ts
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Verify toolchain
        run: npm run verify:toolchain

      - name: Install dependencies
        run: npm ci

      - name: Process lifecycle tests
        run: npx vitest run ${{ matrix.tests }}

  python:
    name: Ruff (Python tooling)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff==0.15.1

      - name: Ruff (lint)
        run: ruff check scripts build

      - name: Ruff (format check)
        run: ruff format --check scripts build
