<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AudioBash Remote">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <link rel="stylesheet" href="css/styles.css">
  <title>AudioBash Remote</title>
</head>
<body>
  <div id="app">
    <!-- Connection Screen -->
    <div id="connect-screen" class="screen active">
      <div class="connect-header">
        <div class="logo">
          <div class="logo-icon"></div>
          <span>AudioBash Remote</span>
        </div>
        <div class="subtitle">Voice control for your desktop terminal</div>
      </div>

      <div class="connect-form">
        <div class="input-group">
          <label for="ip-input">Server address</label>
          <input
            type="text"
            id="ip-input"
            placeholder="ws.audiobash.app"
            inputmode="url"
            autocomplete="off"
          >
        </div>

        <div class="input-group">
          <label for="code-input">Pairing code or password</label>
          <input
            type="text"
            id="code-input"
            placeholder="A3F7X2 or MyPassword1"
            maxlength="32"
            inputmode="text"
            autocapitalize="off"
            autocomplete="off"
            style="letter-spacing: 0.1em; text-align: center; font-size: 1.25rem;"
          >
        </div>

        <button id="connect-btn" class="btn-primary">
          <span class="btn-text">Connect</span>
          <span class="btn-spinner" hidden></span>
        </button>

        <div id="connect-error" class="error"></div>
      </div>

      <div class="connect-help">
        <p>Find connection details in AudioBash Settings &gt; Remote Control</p>
      </div>
    </div>

    <!-- Terminal Screen -->
    <div id="terminal-screen" class="screen">
      <div id="status-bar">
        <div class="status-left">
          <span id="connection-indicator" class="indicator connected"></span>
          <span id="connection-status">Connected</span>
        </div>
        <div class="status-center">
          <select id="tab-selector">
            <option value="tab-1">Terminal 1</option>
          </select>
        </div>
        <div class="status-right">
          <button id="disconnect-btn" class="btn-icon" title="Disconnect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="terminal-container"></div>

      <!-- File Browser -->
      <div id="file-browser" class="hidden">
        <div id="file-browser-header">
          <button id="file-back-btn" class="btn-icon" title="Go back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
          </button>
          <div id="current-path">/</div>
          <button id="file-new-btn" class="btn-icon" title="New file/folder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
        </div>
        <div id="file-list"></div>
      </div>

      <!-- File Editor -->
      <div id="file-editor" class="hidden">
        <div id="file-editor-header">
          <button id="editor-back-btn" class="btn-icon" title="Back to files">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
          </button>
          <div id="editor-filename">file.txt</div>
          <button id="editor-save-btn" class="btn-icon btn-save" title="Save file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
              <polyline points="17,21 17,13 7,13 7,21"/>
              <polyline points="7,3 7,8 15,8"/>
            </svg>
          </button>
        </div>
        <textarea id="file-content" spellcheck="false"></textarea>
      </div>

      <!-- Command Input -->
      <div id="command-input-container">
        <input
          type="text"
          id="command-input"
          placeholder="Type command or use voice keyboard..."
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
        >
        <input type="file" id="image-input" accept="image/*" capture="environment" hidden>
        <button id="image-btn" title="Upload image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
        <button id="files-btn" title="File browser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
          </svg>
        </button>
        <button id="send-btn" title="Send command">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- Reconnecting Overlay -->
    <div id="reconnect-overlay" class="overlay" hidden>
      <div class="overlay-content">
        <div class="spinner"></div>
        <div class="overlay-text">Reconnecting...</div>
        <button id="cancel-reconnect" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
