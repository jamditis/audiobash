<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050505">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AudioBash Remote">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <link rel="stylesheet" href="css/styles.css">
  <title>AudioBash Remote</title>
</head>
<body>
  <div id="app">
    <!-- Connection Screen -->
    <div id="connect-screen" class="screen active">
      <div class="connect-header">
        <div class="logo">
          <div class="logo-icon"></div>
          <span>AudioBash Remote</span>
        </div>
        <div class="subtitle">Mobile terminal for AudioBash</div>
      </div>

      <div class="connect-form">
        <div class="input-group">
          <label for="ip-input">IP address or hostname</label>
          <input
            type="text"
            id="ip-input"
            placeholder="192.168.1.70"
            inputmode="url"
            autocomplete="off"
          >
        </div>

        <div class="input-group">
          <label for="code-input">Password (if set)</label>
          <input
            type="password"
            id="code-input"
            placeholder="Optional"
            maxlength="64"
            inputmode="text"
            autocapitalize="off"
            autocomplete="off"
          >
        </div>

        <button id="connect-btn" class="btn-primary">
          <span class="btn-text">Connect</span>
          <span class="btn-spinner" hidden></span>
        </button>

        <div id="connect-error" class="error"></div>
      </div>

      <div class="connect-help">
        <p>Open AudioBash Settings &gt; Remote control to see your IP address</p>
        <p style="font-size: 0.75rem; opacity: 0.7; margin-top: 0.5rem;">Use Tailscale for access outside your local network</p>
      </div>
    </div>

    <!-- Terminal Screen -->
    <div id="terminal-screen" class="screen">
      <div id="status-bar">
        <div class="status-left">
          <span id="connection-indicator" class="indicator connected"></span>
          <span id="connection-status">Connected</span>
        </div>
        <div class="status-center">
          <select id="tab-selector">
            <option value="tab-1">Terminal 1</option>
          </select>
        </div>
        <div class="status-right">
          <button id="disconnect-btn" class="btn-icon" title="Disconnect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="terminal-container"></div>

      <!-- Terminal Auxiliary Keys -->
      <div id="aux-keys">
        <button class="aux-key" data-key="Tab" title="Tab (autocomplete)">tab</button>
        <button class="aux-key" data-key="Escape" title="Escape">esc</button>
        <button class="aux-key modifier" data-modifier="ctrl" title="Ctrl modifier">ctrl</button>
        <button class="aux-key modifier" data-modifier="alt" title="Alt modifier">alt</button>
        <button class="aux-key" data-send="^C" title="Ctrl+C (interrupt)">^C</button>
        <button class="aux-key" data-send="^D" title="Ctrl+D (EOF)">^D</button>
        <button class="aux-key" data-send="^Z" title="Ctrl+Z (suspend)">^Z</button>
        <button class="aux-key" data-char="|" title="Pipe">|</button>
        <button class="aux-key" data-char="~" title="Tilde">~</button>
        <button class="aux-key" data-char="`" title="Backtick">`</button>
        <button class="aux-key" data-arrow="up" title="Up arrow">&#x2191;</button>
        <button class="aux-key" data-arrow="down" title="Down arrow">&#x2193;</button>
      </div>

      <!-- Command Input -->
      <div id="command-input-container">
        <input
          type="text"
          id="command-input"
          placeholder="Type command..."
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
        >
        <button id="send-btn" title="Send command">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- Reconnecting Overlay -->
    <div id="reconnect-overlay" class="overlay" hidden>
      <div class="overlay-content">
        <div class="spinner"></div>
        <div class="overlay-text">Reconnecting...</div>
        <button id="cancel-reconnect" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
